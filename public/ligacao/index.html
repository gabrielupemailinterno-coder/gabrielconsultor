<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Score Comercial — Ligação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<!--
  ======================================================================
  COMO PERSONALIZAR ANTES DE PUBLICAR — leia isto primeiro
  ======================================================================
  1) FOTO E ÁUDIOS: nesta versão, a foto e os 4 áudios NÃO são arquivos
     locais — estão hospedados no Google Drive (pasta pública "ligacao")
     e referenciados por URL direta. Não precisa subir nenhum arquivo de
     mídia junto com este HTML. Se um dia quiser migrar pra hospedagem
     própria, procure as URLs "lh3.googleusercontent.com" (foto) e
     "drive.google.com/uc?export=download" (áudios, em "AUDIO_FILES" no
     <script>) e troque pelos arquivos locais.
     ATENÇÃO: a pasta do Drive está compartilhada como "qualquer pessoa
     com o link PODE EDITAR". Troque pra "Leitor" no Google Drive antes
     de rodar tráfego pago, senão qualquer pessoa com o link pode
     substituir ou apagar os arquivos.
  3) LINKS DE CHECKOUT: procure "CHECKOUT_URL_MENSAL" e
     "CHECKOUT_URL_SEMESTRAL" — hoje os dois apontam pra
     /conhecascoreapp. Troque por links/IDs de checkout distintos por
     plano assim que existirem (isso deixa o pagamento mais direto).
     O código já propaga automaticamente os parâmetros de UTM da URL
     da landing page pro link de checkout.
  4) PIXELS: procure "// EVENTO:" — são os pontos certos pra chamar
     fbq('trackCustom', ...) do Meta e/ou gtag('event', ...) do Google.
     Hoje o gabrielconsultor.com/conhecascoreapp NÃO tem Meta Pixel nem
     Google Analytics/gtag instalados — vale configurar isso antes de
     rodar tráfego pago pra essa página.
  5) "pagamento_aprovado" é um evento de servidor (webhook do seu meio
     de pagamento) — não dá pra disparar só com este arquivo estático.
  ======================================================================
-->

<style>
  :root{
    --bg:#05060a;
    --glass-bg:rgba(255,255,255,.10);
    --glass-bg-strong:rgba(255,255,255,.16);
    --glass-border:rgba(255,255,255,.20);
    --gold:#e7b84e;
    --gold-ink:#1b1409;
    --accept:#32d74b;
    --decline:#ff453a;
    --wa-bg:#0b141a;
    --wa-received:#1f2c34;
    --wa-sent:#025c4c;
    --wa-check:#53bdeb;
    --ink:#f5f3ee;
    --ink-dim:#9aa3af;
    --ink-faint:#5c6570;
    --radius-xl:34px;
    --radius-lg:26px;
    --radius-md:18px;
    --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-display:'Space Grotesk',var(--font-ui);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);font-family:var(--font-ui);color:var(--ink);
    display:flex;align-items:center;justify-content:center;min-height:100dvh;overflow:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;
    background:radial-gradient(ellipse at 50% 15%,#181c26 0%,#05060a 62%);
    z-index:-1;
  }

  .stage{
    width:100%;max-width:430px;height:100dvh;max-height:932px;
    position:relative;background:#000;overflow:hidden;
  }
  @media (min-width:480px){
    .stage{height:min(932px,92dvh);border-radius:48px;
      box-shadow:0 40px 100px -20px rgba(0,0,0,.8),0 0 0 10px #000;}
  }

  .screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:fadeIn .4s ease both;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  [hidden]{display:none !important;}

  .bg-photo{
    position:absolute;inset:-30px;background-size:cover;background-position:center 22%;
    filter:blur(48px) brightness(.32) saturate(1.25);transform:scale(1.15);z-index:0;
  }
  .content{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;width:100%;}

  /* ---------- Intro ---------- */
  .screen-intro .content{align-items:center;justify-content:center;text-align:center;padding:0 40px;gap:22px;}
  .intro-avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.25);}
  .intro-text{font-size:19px;font-weight:500;line-height:1.4;color:var(--ink);}
  .intro-dots{display:flex;gap:5px;}
  .intro-dots span{width:6px;height:6px;border-radius:50%;background:var(--ink-dim);animation:typingBounce 1.1s ease-in-out infinite;}
  .intro-dots span:nth-child(2){animation-delay:.15s;}
  .intro-dots span:nth-child(3){animation-delay:.3s;}

  /* ---------- Ligação (glass / iOS) ---------- */
  .screen-call .content{align-items:center;justify-content:space-between;padding:70px 24px 44px;text-align:center;}
  .call-label{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);font-weight:600;}
  .avatar-wrap{position:relative;width:140px;height:140px;margin-top:34px;}
  .avatar-photo{width:140px;height:140px;border-radius:50%;object-fit:cover;
    border:1px solid rgba(255,255,255,.25);box-shadow:0 18px 40px rgba(0,0,0,.5);}
  .pulse-ring{position:absolute;inset:-14px;border-radius:50%;border:2px solid var(--gold);opacity:.5;
    animation:pulse 1.8s ease-out infinite;}
  @keyframes pulse{0%{transform:scale(.9);opacity:.55;}100%{transform:scale(1.35);opacity:0;}}
  .caller-name{font-family:var(--font-display);font-size:29px;margin:20px 0 2px;font-weight:600;}
  .caller-sub{margin:0;color:var(--ink-dim);font-size:14.5px;}

  .call-bar{
    display:flex;justify-content:space-between;align-items:center;width:100%;
    background:var(--glass-bg);border:1px solid var(--glass-border);backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    border-radius:999px;padding:14px 30px;
  }
  .call-action{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:none;color:var(--ink-dim);font-size:11.5px;cursor:pointer;font-family:var(--font-ui);}
  .call-btn{width:60px;height:60px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(0,0,0,.35);transition:transform .15s ease;}
  .call-btn:active{transform:scale(.92);}
  .call-btn.decline{background:var(--decline);}
  .call-btn.accept{background:var(--accept);}
  .call-btn svg{width:24px;height:24px;}

  /* ---------- Status ---------- */
  .screen-status .content{align-items:center;justify-content:center;gap:16px;background:#0d0f14;}
  .status-dot{width:10px;height:10px;border-radius:50%;background:var(--decline);}
  .status-dot.pulsing{animation:blink 1s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  #statusText{font-size:17px;color:var(--ink-dim);font-weight:500;}

  /* ---------- Lock / notificação ---------- */
  .screen-lock .content{padding:56px 18px 0;align-items:center;}
  .lock-time{font-family:var(--font-display);font-size:64px;font-weight:600;letter-spacing:-.02em;margin-bottom:2px;}
  .lock-date{color:var(--ink-dim);font-size:14px;margin-bottom:44px;}
  .notification{
    width:100%;background:var(--glass-bg-strong);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
    border:1px solid var(--glass-border);border-radius:20px;padding:14px 16px;
    display:flex;gap:12px;align-items:flex-start;cursor:pointer;color:inherit;text-align:left;
    animation:dropIn .5s cubic-bezier(.2,.9,.3,1.2) both;
  }
  @keyframes dropIn{from{transform:translateY(-30px);opacity:0}to{transform:translateY(0);opacity:1}}
  .notif-icon{width:38px;height:38px;border-radius:10px;flex-shrink:0;object-fit:cover;}
  .notif-text{flex:1;min-width:0;}
  .notif-text strong{display:block;font-size:14px;margin-bottom:2px;}
  .notif-text span{font-size:13px;color:var(--ink-dim);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .notif-meta{font-size:11px;color:var(--ink-faint);flex-shrink:0;}

  /* ---------- Chat (estilo mensagens) ---------- */
  .screen-chat .content{background:var(--wa-bg);}
  .chat-header{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;
    border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;background:#111b21;}
  .chat-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;}
  .chat-header strong{display:block;font-size:15px;}
  .chat-status{font-size:12px;color:#8fd0a9;}
  .chat-body{flex:1;overflow-y:auto;padding:18px 12px 24px;display:flex;flex-direction:column;gap:9px;scrollbar-width:none;}
  .chat-body::-webkit-scrollbar{display:none;}

  .bubble-row{display:flex;animation:riseIn .3s ease both;}
  .bubble-row.sent{justify-content:flex-end;}
  @keyframes riseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  .bubble{border-radius:var(--radius-md);padding:10px 13px;max-width:80%;font-size:14.5px;line-height:1.45;}
  .bubble.received{background:var(--wa-received);border-bottom-left-radius:4px;}
  .bubble.sent{background:var(--wa-sent);border-bottom-right-radius:4px;color:#eafff3;}
  .bubble .ticks{font-size:11px;color:var(--wa-check);margin-left:6px;}

  .typing{display:flex;gap:4px;padding:13px 16px;background:var(--wa-received);
    border-radius:var(--radius-md);border-bottom-left-radius:4px;width:fit-content;}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--ink-dim);animation:typingBounce 1.1s ease-in-out infinite;}
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

  .audio-bubble{background:var(--wa-received);border-radius:var(--radius-md);border-bottom-left-radius:4px;
    padding:10px 13px;display:flex;align-items:center;gap:10px;max-width:78%;}
  .play-btn{width:34px;height:34px;border-radius:50%;background:var(--gold);border:none;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--gold-ink);}
  .play-btn svg{width:14px;height:14px;}
  .wave{display:flex;align-items:center;gap:2.5px;height:20px;flex:1;}
  .wave span{width:2.5px;border-radius:2px;background:var(--ink-faint);height:6px;transition:background .2s ease;}
  .wave.playing span{background:var(--gold);animation:waveMove .9s ease-in-out infinite;}
  .wave span:nth-child(odd){animation-delay:.15s;}
  .wave span:nth-child(3n){animation-delay:.3s;}
  @keyframes waveMove{0%,100%{height:5px}50%{height:18px}}
  .audio-duration{font-size:11px;color:var(--ink-faint);flex-shrink:0;}

  .quick-replies{display:flex;flex-direction:column;gap:8px;margin-top:2px;width:100%;}
  .quick-btn{background:var(--wa-received);border:1.5px solid rgba(231,184,78,.55);color:var(--gold);
    border-radius:16px;padding:11px 16px;font-size:13.5px;font-weight:600;line-height:1.35;
    cursor:pointer;text-align:left;font-family:var(--font-ui);transition:background .15s ease;}
  .quick-btn:hover,.quick-btn:focus-visible{background:rgba(231,184,78,.14);}
  .quick-btn:active{transform:scale(.98);}
  .quick-btn:disabled{opacity:.35;}

  .price-card{background:#111b21;border:1px solid rgba(231,184,78,.3);border-radius:var(--radius-lg);
    padding:20px;margin-top:2px;max-width:92%;}
  .score-gauge{display:flex;justify-content:center;margin-bottom:6px;}
  .score-gauge svg{width:120px;height:70px;}
  .score-num{font-family:var(--font-display);font-size:15px;font-weight:600;text-align:center;color:var(--gold);
    margin-bottom:2px;letter-spacing:.02em;}
  .score-label{text-align:center;font-size:11.5px;color:var(--ink-dim);margin-bottom:16px;}
  .plan-toggle{display:flex;background:#0b141a;border-radius:999px;padding:4px;gap:4px;margin-bottom:16px;}
  .plan-opt{flex:1;border:none;background:transparent;color:var(--ink-dim);padding:9px 8px;border-radius:999px;
    font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--font-ui);position:relative;}
  .plan-opt.active{background:var(--gold);color:var(--gold-ink);}
  .plan-tag{position:absolute;top:-9px;right:2px;background:var(--accept);color:#08150f;font-size:8.5px;
    font-weight:700;padding:2px 6px;border-radius:6px;letter-spacing:.02em;}
  .plan-price{font-family:var(--font-display);font-size:26px;font-weight:600;margin:0 0 2px;}
  .plan-sub{font-size:12px;color:var(--ink-dim);margin:0 0 16px;}
  .cta-btn{display:block;width:100%;text-align:center;text-decoration:none;background:var(--gold);color:var(--gold-ink);
    border:none;padding:14px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font-ui);}
  .cta-btn:active{transform:scale(.985);}
  .fine-print{text-align:center;font-size:11px;color:var(--ink-faint);margin-top:10px;}

  .restart{position:absolute;top:14px;right:14px;z-index:5;background:rgba(0,0,0,.35);border:none;
    color:var(--ink-faint);font-size:11px;padding:6px 10px;border-radius:999px;cursor:pointer;font-family:var(--font-ui);}

  /* ---------- Push notification (in-app, drops from top) ---------- */
  .push-notif{
    position:absolute;top:12px;left:12px;right:12px;z-index:20;
    background:rgba(28,30,38,.88);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
    border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:12px 14px;
    display:flex;gap:11px;align-items:flex-start;cursor:pointer;color:inherit;text-align:left;
    box-shadow:0 14px 40px rgba(0,0,0,.55);
    animation:dropIn .55s cubic-bezier(.2,.9,.3,1.2) both;
  }
  .push-notif.leaving{animation:dropOut .3s ease forwards;}
  @keyframes dropOut{to{transform:translateY(-40px);opacity:0}}
  .push-icon{width:34px;height:34px;border-radius:9px;flex-shrink:0;background:var(--gold);color:var(--gold-ink);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:15px;}
  .push-body{flex:1;min-width:0;}
  .push-title{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-dim);margin-bottom:2px;font-weight:600;letter-spacing:.02em;}
  .push-title span:last-child{font-size:10.5px;color:var(--ink-faint);font-weight:500;}
  .push-msg{font-size:13.5px;line-height:1.35;color:var(--ink);}

  /* ---------- Score app mock (fullscreen overlay) ---------- */
  .screen-scoreapp{background:#0b0d12;z-index:15;}
  .screen-scoreapp .content{padding:0;}
  .sa-header{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;}
  .sa-back{background:none;border:none;color:var(--gold);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font-ui);
    display:flex;align-items:center;gap:4px;padding:4px 6px;margin-left:-6px;}
  .sa-back svg{width:16px;height:16px;}
  .sa-brand{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.01em;flex:1;text-align:center;margin-right:38px;}
  .sa-body{flex:1;overflow-y:auto;padding:22px 20px 30px;display:flex;flex-direction:column;gap:16px;}
  .sa-greeting{font-family:var(--font-display);font-size:22px;font-weight:600;line-height:1.25;}
  .sa-greeting span{color:var(--gold);}
  .sa-sub{color:var(--ink-dim);font-size:13.5px;line-height:1.45;margin-top:-8px;}
  .sa-card{background:#131822;border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:18px;}
  .sa-card h3{margin:0 0 4px;font-size:14px;font-weight:600;color:var(--ink);}
  .sa-card p.sa-hint{margin:0 0 14px;font-size:12px;color:var(--ink-dim);}
  .sa-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);}
  .sa-row:last-child{border-bottom:none;}
  .sa-row label{font-size:13.5px;color:var(--ink);}
  .sa-stepper{display:flex;align-items:center;gap:10px;}
  .sa-stepper button{width:28px;height:28px;border-radius:50%;border:1px solid rgba(231,184,78,.4);
    background:transparent;color:var(--gold);font-size:16px;font-weight:600;cursor:pointer;line-height:1;}
  .sa-stepper button:active{transform:scale(.92);}
  .sa-stepper span{font-family:var(--font-display);font-weight:600;min-width:22px;text-align:center;color:var(--ink);}
  .sa-cta{background:var(--gold);color:var(--gold-ink);border:none;padding:14px;border-radius:14px;
    font-size:14.5px;font-weight:700;cursor:pointer;font-family:var(--font-ui);width:100%;}
  .sa-cta:active{transform:scale(.985);}
  .sa-toast{margin-top:6px;background:rgba(50,215,75,.14);border:1px solid rgba(50,215,75,.35);color:#8fd0a9;
    border-radius:12px;padding:12px 14px;font-size:13px;text-align:center;animation:fadeIn .3s ease;}

  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;}}
</style>
</head>
<body>

<div class="stage" id="stage">
  <button class="restart" id="btnRestart" title="Reiniciar demonstração">reiniciar</button>

  <!-- 0. Intro -->
  <section class="screen screen-intro" data-screen="intro">
    <div class="bg-photo" style="background-image:url('https://lh3.googleusercontent.com/d/1CsbySbeNXqvgnurD_xy5gbmsy4n-rtFN')"></div>
    <div class="content">
      <img class="intro-avatar" src="https://lh3.googleusercontent.com/d/1CsbySbeNXqvgnurD_xy5gbmsy4n-rtFN" alt="Gabriel">
      <p class="intro-text">Gabriel está tentando falar com você</p>
      <div class="intro-dots"><span></span><span></span><span></span></div>
    </div>
  </section>

  <!-- 1. Chamada recebida -->
  <section class="screen screen-call" data-screen="call" hidden>
    <div class="bg-photo" style="background-image:url('https://lh3.googleusercontent.com/d/1CsbySbeNXqvgnurD_xy5gbmsy4n-rtFN')"></div>
    <div class="content">
      <span class="call-label">chamada recebida</span>
      <div class="avatar-wrap">
        <div class="pulse-ring"></div>
        <img class="avatar-photo" src="https://lh3.googleusercontent.com/d/1CsbySbeNXqvgnurD_xy5gbmsy4n-rtFN" alt="Gabriel">
      </div>
      <div>
        <h1 class="caller-name">Gabriel</h1>
        <p class="caller-sub">Score Comercial · chamada</p>
      </div>
      <div class="call-bar">
        <button class="call-action" id="btnDecline">
          <span class="call-btn decline" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M21 15.5c-1.5 0-3-.3-4.3-.8-.4-.2-.9-.1-1.2.2l-1.9 1.9c-2.5-1.3-4.6-3.3-5.8-5.8l1.9-1.9c.3-.3.4-.8.2-1.2C9.3 6.7 9 5.2 9 3.7 9 3.3 8.7 3 8.3 3H4.5C4.2 3 4 3.2 4 3.5 4 13.2 11.8 21 21.5 21c.3 0 .5-.2.5-.5v-3.8c0-.4-.3-.7-.7-.7z" fill="#fff" transform="rotate(135 12 12)"/></svg>
          </span>
          recusar
        </button>
        <button class="call-action" id="btnAnswer">
          <span class="call-btn accept" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M21 15.5c-1.5 0-3-.3-4.3-.8-.4-.2-.9-.1-1.2.2l-1.9 1.9c-2.5-1.3-4.6-3.3-5.8-5.8l1.9-1.9c.3-.3.4-.8.2-1.2C9.3 6.7 9 5.2 9 3.7 9 3.3 8.7 3 8.3 3H4.5C4.2 3 4 3.2 4 3.5 4 13.2 11.8 21 21.5 21c.3 0 .5-.2.5-.5v-3.8c0-.4-.3-.7-.7-.7z" fill="#fff"/></svg>
          </span>
          atender
        </button>
      </div>
    </div>
  </section>

  <!-- 2. Status (conectando / instável / encerrada / recusada) -->
  <section class="screen screen-status" data-screen="status" hidden>
    <div class="content">
      <div class="status-dot pulsing" id="statusDot"></div>
      <p id="statusText">conectando…</p>
    </div>
  </section>

  <!-- 3. Lock + notificação -->
  <section class="screen screen-lock" data-screen="lock" hidden>
    <div class="content">
      <div class="lock-time" id="lockTime">--:--</div>
      <div class="lock-date">chamada encerrada</div>
      <button class="notification" id="btnOpenChat">
        <img class="notif-icon" src="https://lh3.googleusercontent.com/d/1CsbySbeNXqvgnurD_xy5gbmsy4n-rtFN" alt="">
        <div class="notif-text">
          <strong>Gabriel</strong>
          <span id="notifPreviewText">🎤 mensagem de voz</span>
        </div>
        <div class="notif-meta">agora</div>
      </button>
    </div>
  </section>

  <!-- 4. Chat -->
  <section class="screen screen-chat" data-screen="chat" hidden>
    <div class="content">
      <header class="chat-header">
        <img class="chat-avatar" src="https://lh3.googleusercontent.com/d/1CsbySbeNXqvgnurD_xy5gbmsy4n-rtFN" alt="Gabriel">
        <div>
          <strong>Gabriel</strong>
          <span class="chat-status">online</span>
        </div>
      </header>
      <div class="chat-body" id="chatBody"></div>
    </div>
  </section>
</div>

<audio id="audio-oi" preload="none"></audio>
<audio id="audio-02" preload="none"></audio>
<audio id="audio-03" preload="none"></audio>
<audio id="audio-04" preload="none"></audio>

<script>
(function(){
  "use strict";

  // ===== CONFIGURÁVEIS =========================================
  var AUDIO_FILES = [
    { id:'audio-oi', src:'/ligacao/audio/a1.m4a', seconds:16.4 },
    { id:'audio-02', src:'/ligacao/audio/a2.m4a', seconds:31.8 },
    { id:'audio-03', src:'/ligacao/audio/a3.m4a', seconds:35.3 },
    { id:'audio-04', src:'/ligacao/audio/a4.m4a', seconds:26.2 }
  ];
  var CHECKOUT_URL_MENSAL    = "https://gabrielconsultor.com/conhecascoreapp";
  var CHECKOUT_URL_SEMESTRAL = "https://gabrielconsultor.com/conhecascoreapp";

  function formatDuration(sec){
    var m = Math.floor(sec/60), s = Math.round(sec%60);
    return m+':'+String(s).padStart(2,'0');
  }
  // ==============================================================

  function track(name, params){
    // EVENTO: dispare aqui seus pixels de conversão por etapa.
    // if (window.fbq) fbq('trackCustom', name, params||{});
    // if (window.gtag) gtag('event', name, params||{});
    console.log('[funil]', name, params||'');
  }

  function buildCheckoutUrl(base){
    var qs = window.location.search;
    if (!qs) return base;
    return base + (base.indexOf('?') > -1 ? '&' : '?') + qs.replace(/^\?/, '');
  }

  var screens = {};
  document.querySelectorAll('.screen').forEach(function(el){ screens[el.dataset.screen] = el; });
  function show(name){
    Object.keys(screens).forEach(function(k){ screens[k].hidden = (k !== name); });
  }

  var chatBody = document.getElementById('chatBody');
  function scrollChat(){ chatBody.scrollTop = chatBody.scrollHeight; }

  function typingThenRun(delay, fn){
    var row = document.createElement('div');
    row.className = 'bubble-row';
    row.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    chatBody.appendChild(row);
    scrollChat();
    setTimeout(function(){ row.remove(); fn(); }, delay);
  }

  function addTextBubble(text){
    var row = document.createElement('div');
    row.className = 'bubble-row';
    var b = document.createElement('div');
    b.className = 'bubble received';
    b.textContent = text;
    row.appendChild(b);
    chatBody.appendChild(row);
    scrollChat();
  }

  function addSentBubble(text){
    var row = document.createElement('div');
    row.className = 'bubble-row sent';
    var b = document.createElement('div');
    b.className = 'bubble sent';
    b.innerHTML = '<span>'+text+'</span><span class="ticks">✓✓</span>';
    row.appendChild(b);
    chatBody.appendChild(row);
    scrollChat();
  }

  function waveBars(){
    var html = '';
    for (var i=0;i<22;i++){
      var h = 6 + Math.round(Math.abs(Math.sin(i*1.7))*14);
      html += '<span style="height:'+h+'px"></span>';
    }
    return html;
  }

  function addAudioBubble(audioEl, fallbackMs, durationLabel, onStart, onDone){
    var row = document.createElement('div');
    row.className = 'bubble-row';
    row.innerHTML =
      '<div class="audio-bubble">' +
        '<button class="play-btn" aria-label="Reproduzir áudio">' +
          '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>' +
        '</button>' +
        '<div class="wave">'+waveBars()+'</div>' +
        '<span class="audio-duration">'+durationLabel+'</span>' +
      '</div>';
    chatBody.appendChild(row);
    scrollChat();

    var playBtn = row.querySelector('.play-btn');
    var wave = row.querySelector('.wave');
    var played = false;

    playBtn.addEventListener('click', function(){
      if (played) return;
      played = true;
      onStart && onStart();
      wave.classList.add('playing');
      playBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

      var finished = false;
      function finish(){
        if (finished) return;
        finished = true;
        wave.classList.remove('playing');
        onDone && onDone();
      }
      audioEl.play().then(function(){
        audioEl.addEventListener('ended', finish, {once:true});
      }).catch(function(){
        setTimeout(finish, fallbackMs);
      });
      setTimeout(finish, fallbackMs + 4000);
    });
  }

  function addQuickReplies(options){
    var row = document.createElement('div');
    row.className = 'bubble-row';
    var wrap = document.createElement('div');
    wrap.className = 'quick-replies';
    options.forEach(function(opt){
      var btn = document.createElement('button');
      btn.className = 'quick-btn';
      btn.textContent = opt.label;
      btn.addEventListener('click', function(){
        wrap.querySelectorAll('.quick-btn').forEach(function(b){ b.disabled = true; });
        addSentBubble(opt.label);
        opt.onClick();
      });
      wrap.appendChild(btn);
    });
    row.appendChild(wrap);
    chatBody.appendChild(row);
    scrollChat();
  }

  function renderGauge(container, target, label){
    container.innerHTML =
      '<div class="score-gauge"><svg viewBox="0 0 120 70">' +
        '<path d="M10 65 A50 50 0 0 1 110 65" stroke="#2a2f3a" stroke-width="8" fill="none" stroke-linecap="round"/>' +
        '<path class="gaugeFg" d="M10 65 A50 50 0 0 1 110 65" stroke="#e7b84e" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="157" stroke-dashoffset="157"/>' +
      '</svg></div>' +
      '<p class="score-num">0</p>' +
      '<p class="score-label">'+label+'</p>';
    var gaugeFg = container.querySelector('.gaugeFg');
    var scoreNum = container.querySelector('.score-num');
    var offset = 157 - (157 * Math.min(Math.max(target,0),100) / 100);
    requestAnimationFrame(function(){
      gaugeFg.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)';
      gaugeFg.style.strokeDashoffset = offset;
      var n = 0;
      var t = setInterval(function(){
        n += Math.max(1, Math.round(target/25));
        if (n >= target){ n = target; clearInterval(t); }
        scoreNum.textContent = n;
      }, 30);
    });
  }

  function addPriceCard(simScore, simLabel){
    var row = document.createElement('div');
    row.className = 'bubble-row';
    var card = document.createElement('div');
    card.className = 'price-card';
    card.innerHTML =
      '<div class="gaugeSlot"></div>' +
      '<div class="plan-toggle">' +
        '<button class="plan-opt" data-plan="mensal">Mensal</button>' +
        '<button class="plan-opt active" data-plan="semestral">Semestral<span class="plan-tag">-15%</span></button>' +
      '</div>' +
      '<p class="plan-price">R$ 49,70 <span style="font-size:13px;color:var(--ink-dim);font-weight:500;">/ 6 meses</span></p>' +
      '<p class="plan-sub">equivale a R$ 8,28/mês · pagamento via PIX</p>' +
      '<a class="cta-btn" href="#" target="_blank" rel="noopener">Assinar agora</a>' +
      '<p class="fine-print">Cancele quando quiser</p>';
    row.appendChild(card);
    chatBody.appendChild(row);
    scrollChat();

    var gaugeSlot = card.querySelector('.gaugeSlot');
    if (typeof simScore === 'number'){
      renderGauge(gaugeSlot, simScore, simLabel || 'score preliminar da simulação');
    } else {
      renderGauge(gaugeSlot, 0, 'seu score real começa a ser calculado no 1º registro');
    }

    track('plano_visualizado', {origem: typeof simScore === 'number' ? 'simulacao' : 'direto'});

    var opts = card.querySelectorAll('.plan-opt');
    var planPrice = card.querySelector('.plan-price');
    var planSub = card.querySelector('.plan-sub');
    var ctaBtn = card.querySelector('.cta-btn');
    var currentPlan = 'semestral';

    function updateCtaHref(){
      var base = currentPlan === 'mensal' ? CHECKOUT_URL_MENSAL : CHECKOUT_URL_SEMESTRAL;
      ctaBtn.href = buildCheckoutUrl(base);
    }
    updateCtaHref();

    opts.forEach(function(btn){
      btn.addEventListener('click', function(){
        opts.forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        currentPlan = btn.dataset.plan;
        if (currentPlan === 'mensal'){
          planPrice.innerHTML = 'R$ 9,70 <span style="font-size:13px;color:var(--ink-dim);font-weight:500;">/mês</span>';
          planSub.textContent = 'renovação mensal · pagamento via PIX';
        } else {
          planPrice.innerHTML = 'R$ 49,70 <span style="font-size:13px;color:var(--ink-dim);font-weight:500;">/ 6 meses</span>';
          planSub.textContent = 'equivale a R$ 8,28/mês · pagamento via PIX';
        }
        updateCtaHref();
        track('plano_selecionado', {plano: currentPlan});
      });
    });
    ctaBtn.addEventListener('click', function(){
      track('checkout_iniciado', {plano: currentPlan});
    });
  }

  // ---------- Fluxo: intro -> ligação ----------
  track('lp_visualizada');
  setTimeout(function(){ show('call'); }, 1700);

  document.getElementById('btnAnswer').addEventListener('click', function(){
    track('ligacao_atendida');
    show('status');
    setStatus('conectando…', true);
    setTimeout(function(){
      setStatus('sinal instável…', true);
      setTimeout(function(){
        setStatus('chamada encerrada', false);
        setTimeout(function(){ goToLock('🎤','mensagem de voz'); }, 700);
      }, 1000);
    }, 1100);
  });

  document.getElementById('btnDecline').addEventListener('click', function(){
    track('ligacao_recusada');
    show('status');
    setStatus('chamada recusada', false);
    setTimeout(function(){ goToLock('💬','Tudo bem, vou te explicar por aqui'); }, 900);
  });

  function setStatus(text, pulsing){
    document.getElementById('statusText').textContent = text;
    document.getElementById('statusDot').classList.toggle('pulsing', pulsing);
  }

  function goToLock(icon, text){
    var now = new Date();
    document.getElementById('lockTime').textContent =
      String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    document.getElementById('notifPreviewText').textContent = icon+' '+text;
    show('lock');
  }

  document.getElementById('btnOpenChat').addEventListener('click', function(){
    track('notificacao_aberta');
    show('chat');
    chatBody.innerHTML = '';
    startChat();
  });

  document.getElementById('btnRestart').addEventListener('click', function(){ location.reload(); });

  // ---------- Chat ----------
  function startChat(){
    AUDIO_FILES.forEach(function(item){
      document.getElementById(item.id).src = item.src;
    });
    playAudioSequence(0);
  }

  function playAudioSequence(index){
    if (index >= AUDIO_FILES.length){
      typingThenRun(700, showDiagnostic);
      return;
    }
    var item = AUDIO_FILES[index];
    var el = document.getElementById(item.id);
    var n = index + 1;
    typingThenRun(index === 0 ? 1100 : 900, function(){
      addAudioBubble(
        el, Math.round(item.seconds*1000) + 4000, formatDuration(item.seconds),
        function(){ track('audio_'+n+'_iniciado'); },
        function(){
          track('audio_'+n+'_concluido');
          playAudioSequence(index + 1);
        }
      );
    });
  }

  function showDiagnostic(){
    addTextBubble('Qual dessas situações mais acontece com você?');
    addQuickReplies([
      { key:'esforco_sem_visibilidade', label:'Trabalho muito, mas não sei onde estou errando.',
        reply:'Isso é clássico — esforço sem visibilidade. O Score separa exatamente isso: mostra se o problema é quantidade de atividade ou qualidade da conversão.' },
      { key:'rotina', label:'Tenho dificuldade em manter uma rotina.',
        reply:'Faz sentido. Por isso o registro é de 2 minutos por dia — pouco atrito, e o app monta a rotina por você.' },
      { key:'conversao', label:'Faço oportunidades, mas converto pouco.',
        reply:'Aí o gargalo normalmente está entre reunião e proposta, ou proposta e fechamento. O Score aponta exatamente onde.' },
      { key:'so_conhecer', label:'Só quero conhecer o Score Comercial.',
        reply:'Sem problema, vou direto ao ponto então.' }
    ].map(function(opt){
      return {
        label: opt.label,
        onClick: function(){
          track('dor_selecionada', {dor: opt.key});
          typingThenRun(800, function(){
            addTextBubble(opt.reply);
            typingThenRun(1000, showBranchQuestion);
          });
        }
      };
    }));
  }

  function showBranchQuestion(){
    addTextBubble('Quer ver como funciona ou já ir direto pros planos?');
    addQuickReplies([
      { label:'Quero ver como funciona', onClick: function(){
          track('demonstracao_iniciada');
          typingThenRun(700, function(){
            addTextBubble('Show, vamos simular rapidinho — 3 perguntas.');
            typingThenRun(900, runSimulation);
          });
        }
      },
      { label:'Quero ir direto aos planos', onClick: function(){
          typingThenRun(700, function(){
            addTextBubble('Fechado, aqui estão os planos:');
            typingThenRun(500, function(){ addPriceCard(); });
          });
        }
      }
    ]);
  }

  function runSimulation(){
    addTextBubble('Qual sua meta de vendas por mês?');
    addQuickReplies([
      {label:'Até R$ 20 mil', onClick:function(){ askOportunidades(); }},
      {label:'R$ 20 mil – 50 mil', onClick:function(){ askOportunidades(); }},
      {label:'R$ 50 mil – 100 mil', onClick:function(){ askOportunidades(); }},
      {label:'Acima de R$ 100 mil', onClick:function(){ askOportunidades(); }}
    ]);
  }

  function askOportunidades(){
    typingThenRun(700, function(){
      addTextBubble('Quantas oportunidades você gera por semana?');
      addQuickReplies([
        {label:'1 a 3', onClick:function(){ askFollowup(-15); }},
        {label:'4 a 8', onClick:function(){ askFollowup(0); }},
        {label:'9 a 15', onClick:function(){ askFollowup(10); }},
        {label:'Mais de 15', onClick:function(){ askFollowup(15); }}
      ]);
    });
  }

  function askFollowup(oportunidadesPeso){
    typingThenRun(700, function(){
      addTextBubble('Você registra seus follow-ups?');
      addQuickReplies([
        {label:'Sempre', onClick:function(){ finishSimulation(oportunidadesPeso, 20, 'sempre'); }},
        {label:'Às vezes', onClick:function(){ finishSimulation(oportunidadesPeso, 0, 'as_vezes'); }},
        {label:'Nunca', onClick:function(){ finishSimulation(oportunidadesPeso, -20, 'nunca'); }}
      ]);
    });
  }

  function finishSimulation(oportunidadesPeso, followupPeso, followupKey){
    var score = Math.min(100, Math.max(0, 50 + oportunidadesPeso + followupPeso));
    var risco;
    if (followupKey === 'nunca'){
      risco = 'seu principal risco parece estar na falta de acompanhamento dos follow-ups.';
    } else if (oportunidadesPeso < 0){
      risco = 'seu principal risco parece estar na geração de oportunidades.';
    } else {
      risco = 'seu principal risco parece estar na constância da rotina de registro.';
    }
    typingThenRun(900, function(){
      addTextBubble('Score preliminar: '+score+'/100. '+risco);
      addTextBubble('⚠️ isso é uma simulação simplificada — no app completo o cálculo considera toda a sua rotina.');
      typingThenRun(900, function(){ addPriceCard(score, 'score preliminar da simulação'); });
    });
  }

})();
</script>
</body>
</html>
